<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sodicarga - Iniciar Sesión</title>
    <style>
        /* Fondo general con la imagen 333.png cubriendo toda la pantalla */
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0;
            background: url('333.png') no-repeat center center fixed; 
            background-size: cover; 
            color: #222; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Cuadro de logueo con fondo blanco sólido y sombra */
        .login-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            text-align: center;
        }

        .login-container h2 {
            color: #e30613;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 22px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .login-subtitle {
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
            color: #444;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn-login {
            background: #e30613;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #b80510;
        }

        .error-msg {
            color: #e30613;
            font-size: 12px;
            margin-top: 12px;
            display: none;
            font-weight: bold;
        }

        /* Adaptabilidad para celulares */
        @media (max-width: 480px) {
            .login-container {
                margin: 15px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Sodicarga</h2>
        <p class="login-subtitle">Sistema Checklist Preoperacional PESV</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Usuario</label>
                <input type="text" id="usuario" placeholder="Ingrese el usuario" required>
            </div>
            
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="Ingrese su contraseña" required>
            </div>

            <button type="submit" class="btn-login">Ingresar</button>
            <div id="errorLogin" class="error-msg">Usuario o contraseña incorrectos</div>
        </form>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE MONGODB ATLAS DATA API
        // ==========================================
        const ATLAS_URL = "https://data.mongodb-api.com/app/data-xxxx/endpoint/data/v1"; // Reemplaza 'data-xxxx' con el ID de tu app en Atlas si aplica
        const ATLAS_API_KEY = "al-ieDsW1653q0sNDGFU9QZWTdm_kGYfh3I2HeGUSLBku9";
        const CLUSTER_NAME = "Cluster0"; 
        const DB_NAME = "sodicarga";

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const user = document.getElementById('usuario').value.trim();
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorLogin');
            const btnSubmit = document.querySelector('.btn-login');

            // Deshabilitar botón mientras consulta la nube
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Verificando en la nube...";
            errorMsg.style.display = 'none';

            // 1. Verificación para el Administrador principal (Acceso maestro local)
            if ((user === 'Administrador' || user === 'administrador') && pass === 'Tato2756*') {
                localStorage.setItem('sodicarga_user_actual', user);
                localStorage.setItem('sodicarga_rol_actual', 'Administrador');
                window.location.href = 'panel-admin.html';
                return;
            }

            try {
                // 2. Consultar usuarios en la nube de MongoDB Atlas
                const respuesta = await fetch(`${ATLAS_URL}/action/find`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Access-Control-Request-Headers": "*",
                        "api-key": ATLAS_API_KEY
                    },
                    body: JSON.stringify({
                        dataSource: CLUSTER_NAME,
                        database: DB_NAME,
                        collection: "usuarios",
                        filter: { 
                            nombre: { $regex: `^${user}$`, $options: "i" }, 
                            clave: pass 
                        }
                    })
                });

                const data = await respuesta.json();
                const usuariosEncontrados = data.documents;

                if (usuariosEncontrados && usuariosEncontrados.length > 0) {
                    const usuarioEncontrado = usuariosEncontrados[0];
                    
                    // Guardar datos de la sesión actual en el navegador
                    localStorage.setItem('sodicarga_user_actual', usuarioEncontrado.nombre);
                    localStorage.setItem('sodicarga_rol_actual', usuarioEncontrado.rol);

                    // Redirección basada en el rol del usuario
                    if (usuarioEncontrado.rol === 'Administrador') {
                        window.location.href = 'panel-admin.html';
                    } else {
                        window.location.href = 'checklist.html';
                    }
                } else {
                    errorMsg.style.display = 'block';
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Ingresar";
                }
            } catch (error) {
                console.error("Error de conexión con Atlas:", error);
                alert("Error al conectar con la base de datos en la nube.");
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Ingresar";
            }
        });
    </script>
</body>
</html>
