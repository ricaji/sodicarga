<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sodicarga - Iniciar Sesión</title>
    <style>
        /* El body usa la imagen 333.png como fondo fijo cubriendo toda la pantalla */
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0;
            background: url('333.png') no-repeat center center fixed; 
            background-size: cover; 
            color: #222; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Cuadro de login con fondo blanco sólido y sombra para resaltar sobre la imagen */
        .login-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            text-align: center;
        }

        .login-container h2 {
            color: #e30613;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            text-transform: uppercase;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
            color: #444;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn-login {
            background: #e30613;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #b80510;
        }

        .error-msg {
            color: #e30613;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        /* Adaptabilidad para celulares */
        @media (max-width: 480px) {
            .login-container {
                margin: 15px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Sodicarga</h2>
        <p style="font-size: 12px; color: #666; margin-bottom: 20px;">Sistema Checklist Preoperacional PESV</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Usuario</label>
                <input type="text" id="usuario" placeholder="Ingrese su usuario" required>
            </div>
            
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="Ingrese su contraseña" required>
            </div>

            <button type="submit" class="btn-login">Ingresar</button>
            <div id="errorLogin" class="error-msg">Usuario o contraseña incorrectos</div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const user = document.getElementById('usuario').value.trim();
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorLogin');

            // 1. Verificación para el Administrador principal
            if ((user === 'Administrador' || user === 'administrador') && pass === 'Tato2756*') {
                localStorage.setItem('sodicarga_user_actual', user);
                window.location.href = 'panel-admin.html';
                return;
            }

            // 2. Verificación para los demás usuarios registrados en LocalStorage
            let usuariosRegistrados = JSON.parse(localStorage.getItem('sodicarga_usuarios')) || [];
            let usuarioEncontrado = usuariosRegistrados.find(u => 
                u.nombre.toLowerCase() === user.toLowerCase() && u.clave === pass
            );

            if (usuarioEncontrado) {
                localStorage.setItem('sodicarga_user_actual', usuarioEncontrado.nombre);

                if (usuarioEncontrado.rol === 'Administrador') {
                    window.location.href = 'panel-admin.html';
                } else {
                    window.location.href = 'checklist.html';
                }
            } else {
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
