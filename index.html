<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sodicarga - Iniciar Sesión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { color: #e30613; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #333; }
        .input-group input {
            width: 100%; padding: 12px; border: 1px solid #ccc;
            border-radius: 6px; box-sizing: border-box; font-size: 14px;
        }
        button {
            background: #e30613; color: white; border: none; padding: 12px;
            width: 100%; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;
        }
        button:hover { background: #b80510; }
        .error-msg { color: #dc3545; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Sodicarga</h1>
        <p class="subtitle">Inicia sesión en el sistema</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" required placeholder="Usuario">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit">Ingresar</button>
            <p id="errorLogin" class="error-msg">Usuario o contraseña incorrectos.</p>
        </form>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE MONGODB ATLAS DATA API
        // ==========================================
        const ATLAS_URL = "ai.mongodb.com"; // Reemplaza con tu Endpoint URL real
        const ATLAS_API_KEY = "al-ieDsW1653q0sNDGFU9QZWTdm_kGYfh3I2HeGUSLBku9";          // Reemplaza con tu API Key real
        const CLUSTER_NAME = "Cluster0";             // Nombre de tu clúster
        const DB_NAME = "sodicarga";              // Nombre de tu base de datos

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const user = document.getElementById('usuario').value.trim();
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorLogin');
            const btnSubmit = document.querySelector('.btn-login');

            // Deshabilitar botón mientras consulta la nube
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Verificando en la nube...";
            errorMsg.style.display = 'none';

            // 1. Verificación para el Administrador principal (Acceso maestro)
            if ((user === 'Administrador' || user === 'administrador') && pass === 'Tato2756*') {
                localStorage.setItem('sodicarga_user_actual', user);
                localStorage.setItem('sodicarga_rol_actual', 'Administrador');
                window.location.href = 'panel-admin.html';
                return;
            }

            try {
                // 2. Consultar usuarios en la nube de MongoDB Atlas
                const respuesta = await fetch(`${ATLAS_URL}/action/find`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Access-Control-Request-Headers": "*",
                        "api-key": ATLAS_API_KEY
                    },
                    body: JSON.stringify({
                        dataSource: CLUSTER_NAME,
                        database: DB_NAME,
                        collection: "usuarios",
                        filter: { 
                            nombre: { $regex: `^${user}$`, $options: "i" }, 
                            clave: pass 
                        }
                    })
                });

                const data = await respuesta.json();
                const usuariosEncontrados = data.documents;

                if (usuariosEncontrados && usuariosEncontrados.length > 0) {
                    const usuarioEncontrado = usuariosEncontrados[0];
                    
                    // Guardar datos de la sesión actual en el navegador
                    localStorage.setItem('sodicarga_user_actual', usuarioEncontrado.nombre);
                    localStorage.setItem('sodicarga_rol_actual', usuarioEncontrado.rol);

                    // Redirección basada en el rol del usuario
                    if (usuarioEncontrado.rol === 'Administrador') {
                        window.location.href = 'panel-admin.html';
                    } else {
                        window.location.href = 'checklist.html';
                    }
                } else {
                    errorMsg.style.display = 'block';
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Ingresar";
                }
            } catch (error) {
                console.error("Error de conexión con Atlas:", error);
                alert("Error al conectar con la base de datos en la nube.");
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Ingresar";
            }
        });
    </script>
</body>
</html>
