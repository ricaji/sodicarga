<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sodicarga - Panel de Administración</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        /* Pantalla de Login */
        #login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h1 {
            color: #e30613;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Panel de Administración (Oculto al inicio) */
        #admin-container {
            display: none;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        header {
            background: #e30613;
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        h2 {
            color: #e30613;
            margin-top: 0;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background: #e30613;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        button:hover {
            background: #b80510;
        }

        .btn-danger {
            background: #dc3545;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-danger:hover {
            background: #bd2130;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8f9fa;
            color: #333;
        }

        .error-msg {
            color: #dc3545;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- SECCIÓN DE LOGIN -->
    <div id="login-container">
        <div class="login-card">
            <h1>Sodicarga</h1>
            <p class="subtitle">Inicia sesión como Administrador</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" required placeholder="Usuario">
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <button type="submit" style="width: 100%; padding: 12px;">Ingresar</button>
                <p id="errorLogin" class="error-msg">Usuario o contraseña incorrectos.</p>
            </form>
        </div>
    </div>

    <!-- SECCIÓN DE ADMINISTRACIÓN DE USUARIOS -->
    <div id="admin-container">
        <header>
            <h1>Sodicarga - Panel de Control</h1>
            <button onclick="cerrarSesion()" style="background: #333;">Cerrar Sesión</button>
        </header>

        <div class="card">
            <h2>Crear Nuevo Usuario</h2>
            <form id="userForm">
                <div style="display: flex; gap: 15px;">
                    <div class="input-group" style="flex: 1;">
                        <label for="nuevoNombre">Nombre de Usuario</label>
                        <input type="text" id="nuevoNombre" required placeholder="Ej: JuanPerez">
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label for="nuevoRol">Rol</label>
                        <select id="nuevoRol">
                            <option value="Conductor">Conductor</option>
                            <option value="Supervisor">Supervisor</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                    </div>
                </div>
                <button type="submit">Agregar Usuario</button>
            </form>
        </div>

        <div class="card">
            <h2>Lista de Usuarios Registrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios">
                    <!-- Los usuarios se cargarán aquí de forma dinámica -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Datos iniciales de ejemplo
        let usuarios = JSON.parse(localStorage.getItem('sodicarga_usuarios')) || [
            { nombre: 'Administrador', rol: 'Administrador' },
            { nombre: 'CarlosConductor', rol: 'Conductor' }
        ];

        // Manejar el Login
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorLogin');

            if (user === 'Administrador' && pass === 'Tato2756*') {
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('admin-container').style.display = 'block';
                cargarUsuarios();
            } else {
                errorMsg.style.display = 'block';
            }
        });

        // Cerrar sesión
        function cerrarSesion() {
            document.getElementById('admin-container').style.display = 'none';
            document.getElementById('login-container').style.display = 'flex';
            document.getElementById('loginForm').reset();
            document.getElementById('errorLogin').style.display = 'none';
        }

        // Cargar tabla de usuarios
        function cargarUsuarios() {
            const tbody = document.getElementById('tablaUsuarios');
            tbody.innerHTML = '';

            usuarios.forEach((u, index) => {
                let fila = document.tr; // syntax check
                fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${u.nombre}</td>
                    <td>${u.rol}</td>
                    <td><button class="btn-danger" onclick="eliminarUsuario(${index})">Eliminar</button></td>
                `;
                tbody.appendChild(fila);
            });
        }

        // Agregar nuevo usuario
        document.getElementById('userForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const nombre = document.getElementById('nuevoNombre').value;
            const rol = document.getElementById('nuevoRol').value;

            usuarios.push({ nombre, rol });
            localStorage.setItem('sodicarga_usuarios', JSON.stringify(usuarios));
            
            document.getElementById('nuevoNombre').value = '';
            cargarUsuarios();
        });

        // Eliminar usuario
        function eliminarUsuario(index) {
            if(usuarios[index].nombre === 'Administrador') {
                alert('No se puede eliminar al Administrador principal.');
                return;
            }
            usuarios.splice(index, 1);
            localStorage.setItem('sodicarga_usuarios', JSON.stringify(usuarios));
            cargarUsuarios();
        }
    </script>

</body>
</html>
