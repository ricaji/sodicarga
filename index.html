<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sodicarga - Iniciar Sesión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { color: #e30613; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #333; }
        .input-group input {
            width: 100%; padding: 12px; border: 1px solid #ccc;
            border-radius: 6px; box-sizing: border-box; font-size: 14px;
        }
        button {
            background: #e30613; color: white; border: none; padding: 12px;
            width: 100%; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;
        }
        button:hover { background: #b80510; }
        .error-msg { color: #dc3545; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Sodicarga</h1>
        <p class="subtitle">Inicia sesión en el sistema</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" required placeholder="Usuario">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit">Ingresar</button>
            <p id="errorLogin" class="error-msg">Usuario o contraseña incorrectos.</p>
        </form>
    </div>

    <script>
        // Cargar usuarios guardados en LocalStorage (o usar por defecto)
        let usuariosRegistrados = JSON.parse(localStorage.getItem('sodicarga_usuarios')) || [
            { nombre: 'Administrador', rol: 'Administrador' },
            { nombre: 'CarlosConductor', rol: 'Conductor' }
        ];

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const user = document.getElementById('usuario').value.trim();
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorLogin');

            // 1. Validar si es el Administrador principal con su contraseña secreta
            if ((user === 'Administrador' || user === 'administrador') && pass === 'Tato2756*') {
                // Redirige a una página intermedia o panel del admin (puedes crear un archivo panel.html o redirigir directo a usuarios)
                window.location.href = 'panel-admin.html';
                return;
            }

            // 2. Buscar si es otro usuario registrado en la lista
            let usuarioEncontrado = usuariosRegistrados.find(u => u.nombre.toLowerCase() === user.toLowerCase());

            if (usuarioEncontrado) {
                // Los demás usuarios van directo al checklist (puedes pedir contraseña genérica si deseas)
                window.location.href = 'checklist.html';
            } else {
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
